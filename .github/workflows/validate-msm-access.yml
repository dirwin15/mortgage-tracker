name: Validate MSM access (test only)

on:
  workflow_dispatch:

jobs:
  validate:
    # Self-hosted, run interactively at logon (see msm_automation/README.md) so
    # Chromium has a real desktop to render into - this job needs a real
    # (non-datacenter) IP and a real display, neither of which a GitHub-hosted
    # runner can provide for this specific site.
    runs-on: [self-hosted, msm-scraper]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # actions/setup-python's installer invocation breaks on this self-hosted
      # runner (it's built for GitHub's pre-configured hosted images), and
      # plain "python" on PATH resolves to a Windows Store stub, not a real
      # interpreter. Use the already-installed Python via the "py" launcher
      # instead of fighting either of those.
      - name: Install patchright
        run: |
          py -m pip install --upgrade pip
          py -m pip install patchright
          py -m patchright install chromium

      - name: Run MSM access validation
        run: py scraper/msm_automation/validate_msm_access.py
