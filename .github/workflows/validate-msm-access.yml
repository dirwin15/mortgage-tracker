name: Validate MSM access (test only)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Xvfb and patchright
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install patchright
          python -m patchright install --with-deps chromium

      - name: Run MSM access validation under Xvfb
        run: xvfb-run -a python scraper/msm_automation/validate_msm_access.py
